<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculatorstyle.css">
</head>
<body>
    <div class="calculatorBody">
        <div class="display">  
            <p class="calculationLogic"></p>
            <p class="currentCalculation"></p>        
        </div>
        <div class="buttonArea"> 
            <div class="numberButtons">
                <button class="number" id="one">1</button>
                <button class="number" id="two">2</button>
                <button class="number" id="three">3</button>
                <button class="number" id="four">4</button>
                <button class="number" id="five">5</button>
                <button class="number" id="six">6</button>
                <button class="number" id="seven">7</button>
                <button class="number" id="eight">8</button>
                <button class="number" id="nine">9</button>
                <button class="number" id="zero">0</button>
            </div>
            <div class="operatorButtons">
                <button class="executer" id="deleteButton">delete</button>
                <button class="executer" id="clearButton">clear</button>
                <button class="operator" id="addButton">+</button>
                <button class="operator" id="substractButton">-</button>
                <button class="operator" id="multiplyButton">x</button>
                <button class="operator" id="divideButton">/</button>
                <button class="equalizer" id="equalButton">=</button>
            </div>
        </div>   
    </div>

    <script src="calculatorscript.js"></script>
</body>
</html>
